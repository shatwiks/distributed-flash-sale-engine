<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="How the Flash Sale Engine works: Bouncer in RAM vs Accountant on Disk">
  <defs>
    <style>
      .h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #0a0a0a; }
      .hw { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
      .p { font-family: Georgia, serif; font-size: 14px; fill: #444444; }
      .pw { font-family: Georgia, serif; font-size: 14px; fill: #b8b6b2; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; }
      @keyframes flowRight { 0% { transform: translateX(0px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(62px); opacity: 0; } }
      @keyframes flowDown { 0% { transform: translateY(0px); opacity: 0; } 25% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(38px); opacity: 0; } }
      .f1 { animation: flowRight 1.8s linear infinite; }
      .f2 { animation: flowRight 1.8s linear 0.6s infinite; }
      .f3 { animation: flowRight 1.8s linear 1.2s infinite; }
      .fd { animation: flowDown 2.2s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#f5f4f2"/>

  <!-- Title -->
  <text x="36" y="44" class="h" font-size="22">How It Works (Plain English): The Bouncer vs. The Accountant</text>

  <!-- Step 1: 10,000 Fans -->
  <g transform="translate(36, 76)">
    <rect width="230" height="190" rx="14" fill="#ffffff"/>
    <rect x="20" y="20" width="94" height="24" rx="6" fill="#edebe7"/>
    <text x="32" y="36" class="tag" fill="#0a0a0a">THE CROWD</text>
    <text x="20" y="78" class="h" font-size="24">10,000 Fans</text>
    <text x="20" y="108" class="p">Click "Reserve Seat D5"</text>
    <text x="20" y="128" class="p">at the exact same</text>
    <text x="20" y="148" class="p">millisecond.</text>
  </g>

  <!-- Animated Arrows 1 -> 2 -->
  <g transform="translate(274, 170)">
    <line x1="0" y1="0" x2="62" y2="0" stroke="#d4d2ce" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#0a0a0a" class="f1"/>
    <circle cx="0" cy="0" r="5" fill="#0a0a0a" class="f2"/>
    <circle cx="0" cy="0" r="5" fill="#0a0a0a" class="f3"/>
  </g>

  <!-- Step 2: Redis Bouncer -->
  <g transform="translate(346, 76)">
    <rect width="310" height="190" rx="14" fill="#111111"/>
    <rect x="22" y="20" width="150" height="24" rx="6" fill="#047857"/>
    <text x="32" y="36" class="tag" fill="#ffffff">THE BOUNCER (RAM)</text>
    <text x="22" y="78" class="hw" font-size="24">Redis 7 Lua Gate</text>
    <text x="22" y="108" class="pw">Decides in 1.2ms in memory.</text>
    <text x="22" y="128" class="pw">Lets ONLY 1 winner through.</text>
    <text x="22" y="156" class="tag" fill="#f43f5e">9,999 rejected safely (409) · 0 DB hits</text>
  </g>

  <!-- Animated Arrow 2 -> 3 (Only 1 winner) -->
  <g transform="translate(664, 170)">
    <line x1="0" y1="0" x2="62" y2="0" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#047857" class="f1"/>
  </g>

  <!-- Step 3: Postgres Accountant -->
  <g transform="translate(736, 76)">
    <rect width="230" height="190" rx="14" fill="#ffffff"/>
    <rect x="20" y="20" width="152" height="24" rx="6" fill="#edebe7"/>
    <text x="30" y="36" class="tag" fill="#0a0a0a">THE ACCOUNTANT (DISK)</text>
    <text x="20" y="78" class="h" font-size="22">PostgreSQL 16</text>
    <text x="20" y="108" class="p">Saves permanent order</text>
    <text x="20" y="128" class="p">&amp; prints ticket pass.</text>
    <text x="20" y="158" class="tag" fill="#047857">Pool load stays &lt; 10%</text>
  </g>

  <!-- Animated Arrow 3 -> 4 -->
  <g transform="translate(974, 170)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Step 4: Ticket Issued -->
  <g transform="translate(1018, 76)">
    <rect width="146" height="190" rx="14" fill="#047857"/>
    <circle cx="0" cy="95" r="10" fill="#f5f4f2"/>
    <circle cx="146" cy="95" r="10" fill="#f5f4f2"/>
    <text x="24" y="64" class="hw" font-size="26">201</text>
    <text x="24" y="90" class="hw" font-size="16">TICKET</text>
    <text x="24" y="112" class="hw" font-size="16">ISSUED</text>
    <text x="24" y="152" class="tag" fill="#d1fae5">SEAT D5 LOCKED</text>
  </g>

  <!-- Bottom Safety Net Banner -->
  <g transform="translate(36, 286)">
    <rect width="1128" height="48" rx="10" fill="#edebe7"/>
    <text x="20" y="29" class="h" font-size="14">Built-In Crash Safety Net (Saga Rollback):</text>
    <text x="322" y="29" class="p">If PostgreSQL crashes mid-write, Redis instantly refunds the seat (INCRBY +1) so zero tickets ever disappear.</text>
  </g>
</svg>
