<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Distributed Flash-Sale Engine — Zero Overbooking at 10,480 RPS">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: -1.5px; }
      .sub { font-family: Georgia, "Times New Roman", serif; fill: #b8b6b2; font-size: 19px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #a1a1a1; letter-spacing: 0.6px; }
      .val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 28px; fill: #ffffff; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #e5e3df; }
      @keyframes pulse { 0%, 100% { opacity: 1; r: 5; } 50% { opacity: 0.35; r: 7; } }
      @keyframes slidePacket { 0% { transform: translateX(0px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(260px); opacity: 0; } }
      .dot { animation: pulse 2.2s ease-in-out infinite; }
      .p1 { animation: slidePacket 2.4s linear infinite; }
      .p2 { animation: slidePacket 2.4s linear 0.8s infinite; }
      .p3 { animation: slidePacket 2.4s linear 1.6s infinite; }
    </style>
  </defs>

  <!-- Outer Warm Paper Frame -->
  <rect width="1200" height="320" rx="20" fill="#f5f4f2"/>

  <!-- Main Dark Notched Ticket Surface -->
  <rect x="20" y="20" width="1160" height="280" rx="18" fill="#111111"/>

  <!-- Ticket Perforation Stripe at Top -->
  <g>
    <rect x="44" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="88" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="132" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="176" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="220" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="264" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="308" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="352" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="396" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="440" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="484" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="528" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="572" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="616" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="660" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="704" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="748" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="792" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="836" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="880" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="924" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="968" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="1012" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="1056" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="1100" y="20" width="22" height="12" fill="#f5f4f2"/>
    <rect x="1144" y="20" width="16" height="12" fill="#f5f4f2"/>
  </g>

  <!-- Semicircular Ticket Side Notches -->
  <circle cx="20" cy="160" r="18" fill="#f5f4f2"/>
  <circle cx="1180" cy="160" r="18" fill="#f5f4f2"/>

  <!-- Left Content -->
  <g transform="translate(68, 86)">
    <circle cx="8" cy="-4" r="5" fill="#10b981" class="dot"/>
    <text x="22" y="0" class="label" fill="#10b981">LIVE ATOMIC RESERVATION ENGINE</text>

    <text x="0" y="54" class="title" font-size="44">DISTRIBUTED FLASH-SALE</text>
    <text x="0" y="102" class="title" font-size="44">TICKET ENGINE.</text>

    <text x="0" y="142" class="sub">10,480 requests per second. One Redis Lua gate. Zero overbooking.</text>

    <!-- Animated Stream Indicator -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="280" height="28" rx="6" fill="#1c1c1c"/>
      <text x="12" y="18" class="mono">EVALSHA reserve_seat.lua · 1.2ms</text>
      <circle cx="295" cy="14" r="4" fill="#10b981" class="p1"/>
      <circle cx="295" cy="14" r="4" fill="#ffffff" class="p2"/>
      <circle cx="295" cy="14" r="4" fill="#10b981" class="p3"/>
    </g>
  </g>

  <!-- Right Live Telemetry Stub -->
  <g transform="translate(790, 68)">
    <rect x="0" y="0" width="340" height="196" rx="14" fill="#1c1c1c"/>
    <text x="24" y="34" class="label">EMPIRICAL K6 BURST PROOF</text>

    <text x="24" y="80" class="val">10,480 RPS</text>
    <text x="200" y="80" class="label" fill="#10b981">9.3× FASTER</text>

    <text x="24" y="128" class="val">18.5 ms</text>
    <text x="200" y="128" class="label" fill="#10b981">p95 LATENCY</text>

    <text x="24" y="174" class="val">0.00%</text>
    <text x="200" y="174" class="label" fill="#10b981">OVERBOOKING</text>
  </g>
</svg>
