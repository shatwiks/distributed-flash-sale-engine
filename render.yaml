# Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  # 1. Express.js High-Throughput Ticket Booking API
  - type: web
    name: ticket-booking-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-booking-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: ticket-booking-redis
          property: connectionString

databases:
  # 2. PostgreSQL 16 Relational Database
  - name: ticket-booking-db
    databaseName: ticket_booking_prod
    user: ticket_booking_user
    plan: free

  # 3. Redis 7 High-Throughput In-Memory Key-Value Cache
  - name: ticket-booking-redis
    type: keyvalue
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Internal private network only
